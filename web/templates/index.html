<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primera Página Web</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
  --fondo: #f4f5f7;
  --fondo-claro: #ffffff;
  --texto: #111827;
  --texto-suave: #6b7280;
  --panel: #ffffff;
  --borde: #e3e6ea;

  --barra: #14171c;
  --barra-borde: #2a2f38;
  --acento: #1256a0;
  --sube: #0f8a4f;
  --baja: #c62828;

  --usd: #2f7d5b;
  --eur: #2b4c9b;
  --jpy: #b23a48;
  --gbp: #6b3fa0;
  --cny: #b8700a;

  --velocidad: 28s;
}

    * { box-sizing: border-box; }

    body {
  margin: 0;
  min-height: 100vh;
  background: var(--fondo);
  color: var(--texto);
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}

.barra {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0 1rem;
  background: var(--barra);
  border-bottom: 1px solid var(--barra-borde);
}

.logo {
  flex-shrink: 0;
  display: flex;
  align-items: center;
}

.logo img {
  height: 3rem;
  width: 8rem;
  object-fit: fill;
  display: block;
}

/* ============ .menu (carrusel de monedas) ============ */
.menu {
  flex: 1;
  min-width: 0;          /* permite que el carrusel se encoja junto al logo */
  overflow: hidden;
  padding: 0.35rem 0;    /* antes 1.25rem, aquí está la reducción en altura */
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}

    .menu__pista {
      display: flex;
      width: max-content;
      animation: desplazar var(--velocidad) linear infinite;
    }

    .menu:hover .menu__pista,
    .menu:focus-within .menu__pista {
      animation-play-state: paused;
    }

    .menu__grupo {
      display: flex;
      flex-shrink: 0;
      justify-content: space-around;
      align-items: center;
      gap: 1rem;
      min-width: 100vw;
      padding-right: 1rem;
      margin: 0;
      list-style: none;
    }

    @keyframes desplazar {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .menu__boton {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.3rem 1rem 0.3rem 0.3rem;
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 999px;
      font: inherit;
      color: var(--texto);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .menu__boton:hover {
      transform: translateY(-2px);
      border-color: var(--texto);
    }

    .menu__boton:focus-visible {
      outline: 3px solid var(--texto);
      outline-offset: 3px;
    }

    .menu__ficha {
      display: grid;
      place-items: center;
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 50%;
      background: var(--color, var(--texto));
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
    }

    .menu__texto {
      display: flex;
      flex-direction: column;
      text-align: left;
      line-height: 1.2;
    }

    .menu__nombre { font-size: 0.85rem; font-weight: 700; }
    .menu__codigo { font-size: 0.7rem; font-weight: 500; color: var(--texto-suave); }

    .menu__boton[data-moneda="dolar"] { --color: var(--usd); }
    .menu__boton[data-moneda="euro"]  { --color: var(--eur); }
    .menu__boton[data-moneda="yen"]   { --color: var(--jpy); }
    .menu__boton[data-moneda="libra"] { --color: var(--gbp); }
    .menu__boton[data-moneda="yuan"]  { --color: var(--cny); }

    @media (prefers-reduced-motion: reduce) {
      .menu {
        overflow-x: auto;
        -webkit-mask-image: none;
                mask-image: none;
      }
      .menu__pista { animation: none; }
      .menu__grupo[aria-hidden="true"] { display: none; }
      .menu__grupo { min-width: max-content; padding-inline: 1rem; }
    }

.logo {
  background: #fff;
  border-radius: 6px;
  overflow: hidden;
  margin: 0.35rem 0;
}

.menu__boton {
  background: #1d2129;
  border: 1px solid var(--barra-borde);
  border-radius: 8px;
  color: #f3f4f6;
}

.menu__boton:hover { border-color: #8b94a3; }
.menu__boton:focus-visible { outline-color: #fff; }
.menu__codigo { color: #9ca3af; }

    /* ============ contenido ============ */
    main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
}

    h1 {
  font-family: inherit;
  font-weight: 700;
  font-size: clamp(1.8rem, 4vw, 2.4rem);
  letter-spacing: -0.02em;
  margin: 0 0 0.35rem;
}

    /* ============ cabecera del contenido y barra de acciones ============ */
.hero {
  display: flex;
  align-items: center;
  gap: 2rem;
  margin-bottom: 2rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--borde);
}

.hero__titulo { flex-shrink: 0; }

.hero__titulo p {
  margin: 0;
  color: var(--texto-suave);
  font-size: 1rem;
}

.ticker {
  --velocidad-ticker: 40s;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  padding: 0.7rem 0;
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}

.ticker__pista {
  display: flex;
  width: max-content;
  animation: desplazar-inverso var(--velocidad-ticker) linear infinite;
}

.ticker:hover .ticker__pista { animation-play-state: paused; }

.ticker__pista--estatica {
  animation: none;
  padding: 0 1rem;
  font-size: 0.85rem;
  color: var(--texto-suave);
}

/* sentido contrario al carrusel de monedas, que va hacia la izquierda */
@keyframes desplazar-inverso {
  from { transform: translateX(-50%); }
  to   { transform: translateX(0); }
}

.ticker__grupo { display: flex; flex-shrink: 0; }

.ticker__item {
  display: inline-flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0 1.25rem;
  border-right: 1px solid var(--borde);
  white-space: nowrap;
}

.ticker__simbolo { font-size: 0.85rem; font-weight: 700; }
.ticker__nombre  { font-size: 0.75rem; color: var(--texto-suave); }
.ticker__precio  { font-size: 0.9rem; font-weight: 600; }
.ticker__cambio  { font-size: 0.8rem; font-weight: 600; color: var(--texto-suave); }
.ticker__cambio.sube { color: var(--sube); }
.ticker__cambio.baja { color: var(--baja); }

@media (prefers-reduced-motion: reduce) {
  .ticker { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
  .ticker__pista { animation: none; }
  .ticker__grupo[aria-hidden="true"] { display: none; }
}

.contenido {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 2rem;
  align-items: start;
}

     .cuadro { transition: border-color 0.3s ease, box-shadow 0.3s ease; }

     .cuadro.resaltado {
  border-color: var(--texto);
  box-shadow: 0 0 0 4px var(--borde);
}

     .cuadro--ancho { grid-column: 1 / -1; }
     .cuadro .lienzo--alto { height: 300px; }

/* ============ selector de periodo ============ */
.tendencias h2,
.noticias h2 {
  margin: 0 0 1rem;
  font-size: 1.05rem;
  font-weight: 700;
}

.periodos {
  display: inline-flex;
  margin-bottom: 1.25rem;
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 8px;
  overflow: hidden;
}

.periodos button {
  padding: 0.45rem 0.95rem;
  border: 0;
  background: transparent;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--texto-suave);
  cursor: pointer;
}

.periodos button + button { border-left: 1px solid var(--borde); }
.periodos button:hover { color: var(--texto); }
.periodos button.activo { background: var(--texto); color: #fff; }

/* ============ tarjetas de monedas ============ */
.cuadro {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 10px;
  padding: 1rem 1.1rem;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
}

.cuadro.resaltado {
  border-color: var(--acento);
  box-shadow: 0 0 0 3px rgba(18, 86, 160, 0.2);
}

.cuadro h3 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 0 0 0.5rem;
  font-size: 0.95rem;
  font-weight: 600;
}

.cuadro h3 span {
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  color: var(--texto-suave);
}

.cifra { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
.cifra small { font-size: 0.75rem; font-weight: 500; letter-spacing: 0; color: var(--texto-suave); }

.variacion { margin: 0.15rem 0 0.75rem; font-size: 0.8rem; color: var(--texto-suave); }
.variacion.sube { color: var(--sube); font-weight: 600; }
.variacion.baja { color: var(--baja); font-weight: 600; }

.lienzo { position: relative; height: 170px; }

/* ============ panel de noticias ============ */
.noticias {
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  scrollbar-width: thin;
  scrollbar-color: #c9ced6 transparent;
}

.noticia__titulo { font-weight: 600; }
.noticia:hover .noticia__titulo { color: var(--acento); text-decoration: none; }

     /* ============ desplegable de monedas ============ */
.menu.pausado .menu__pista {
  animation-play-state: paused;
}

.desplegable {
  position: fixed;
  z-index: 100;
  padding-top: 6px;               /* puente invisible entre el botón y la lista */
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}

.desplegable.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.desplegable__cuadro {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  padding: 0.5rem 1rem;
  background: var(--panel);
  border: 1px solid var(--borde);
  border-top-width: 0;
  text-align: left;
  min-width: 190px;
}

.desplegable__cuadro:first-child {
  border-top-width: 1px;
  border-radius: 12px 12px 0 0;
}

.desplegable__cuadro:last-child {
  border-radius: 0 0 12px 12px;
}

.desplegable__cuadro span {
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--texto-suave);
}

.desplegable__cuadro strong {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--texto);
}

 /* ============ dos columnas: tendencias a la izquierda, noticias a la derecha ============ */
.contenido {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 2rem;
  align-items: start;
  max-width: 1200px;
  margin: 0 auto;
}

.tendencias { min-width: 0; }

.noticias {
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 16px;
  padding: 1rem;
  position: sticky;
  top: 1rem;
  max-height: calc(100vh - 2rem);
  overflow-y: auto;
}

.noticias h2 {
  margin: 0 0 0.75rem;
  font-size: 1.1rem;
}

.noticia {
  display: block;
  padding: 0.7rem 0;
  border-top: 1px solid var(--borde);
  color: var(--texto);
  text-decoration: none;
}

.noticia:first-child { border-top: 0; }

.noticia:hover .noticia__titulo { text-decoration: underline; }

.noticia__titulo {
  display: block;
  font-size: 0.9rem;
  font-weight: 700;
  line-height: 1.3;
}

.noticia__meta {
  display: block;
  margin-top: 0.25rem;
  font-size: 0.75rem;
  color: var(--texto-suave);
}

/* el botón, el fondo y la cabecera solo se ven en pantallas pequeñas */
.noticias__boton,
.noticias__fondo,
.noticias__cerrar { display: none; }

.noticias__cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

/* ============ asistente de IA ============ */
.chat__boton {
  position: fixed;
  left: 1rem;
  bottom: 1rem;
  z-index: 150;
  width: 3.2rem;
  height: 3.2rem;
  border-radius: 50%;
  border: 1px solid var(--borde);
  background: var(--texto);
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}

.chat {
  position: fixed;
  left: 1rem;
  bottom: 5rem;
  z-index: 160;
  display: flex;
  flex-direction: column;
  width: min(92vw, 360px);
  height: min(70vh, 480px);
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 16px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  text-align: left;
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}

.chat.abierto {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.chat__cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--borde);
}

.chat__cerrar {
  background: none;
  border: 0;
  font-size: 1.1rem;
  color: var(--texto);
  cursor: pointer;
}

.chat__mensajes {
  flex: 1;
  overflow-y: auto;
  padding: 0.8rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.chat__msg {
  max-width: 85%;
  padding: 0.5rem 0.75rem;
  border-radius: 12px;
  font-size: 0.9rem;
  line-height: 1.35;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.chat__msg--ia { align-self: flex-start; background: #fff; }
.chat__msg--yo { align-self: flex-end; background: var(--texto); color: #fff; }

.chat__entrada {
  display: flex;
  gap: 0.5rem;
  padding: 0.6rem;
  border-top: 1px solid var(--borde);
}

.chat__entrada input {
  flex: 1;
  min-width: 0;
  padding: 0.5rem 0.7rem;
  border: 1px solid var(--borde);
  border-radius: 999px;
  font: inherit;
  font-size: 0.9rem;
}

.chat__entrada button {
  padding: 0.5rem 0.9rem;
  border: 0;
  border-radius: 999px;
  background: var(--texto);
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.chat__entrada button:disabled { opacity: 0.5; cursor: wait; }

@media (max-width: 900px) {
  .contenido { grid-template-columns: 1fr; }

  /* el panel pasa a ser un cajón lateral */
  .noticias {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    max-height: none;
    width: min(85vw, 340px);
    border-radius: 16px 0 0 16px;
    z-index: 200;
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.3s ease, visibility 0.3s;
    padding-top: env(safe-area-inset-top, 1rem);
  }

  .noticias.abierto {
    transform: translateX(0);
    visibility: visible;
  }

  /* pestaña pegada al borde derecho */
  .noticias__boton {
    display: block;
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 150;
    padding: 0.9rem 0.5rem;
    background: var(--panel);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-right: 0;
    border-radius: 12px 0 0 12px;
    font: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    writing-mode: vertical-rl;
    cursor: pointer;
  }

  .noticias__cerrar {
    display: block;
    background: none;
    border: 0;
    font-size: 1.2rem;
    color: var(--texto);
    cursor: pointer;
  }

  /* capa oscura detrás del cajón */
  .noticias__fondo {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 190;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s;
  }

  .noticias__fondo.visible {
    opacity: 1;
    visibility: visible;
  }
} 

.tarjeta {
  position: relative;
  display: block;
  width: 100%; height: 100%;
  overflow: hidden;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(160deg, #2a3140, #14171c);
  color: #fff;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
}

.tarjeta:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; }

.tarjeta__imagen {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.tarjeta:hover .tarjeta__imagen { transform: scale(1.05); }

/* degradado para que el texto se lea sobre cualquier imagen */
.tarjeta::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10, 12, 16, 0.92) 0%, rgba(10, 12, 16, 0.5) 45%, rgba(10, 12, 16, 0) 75%);
}

.tarjeta__etiqueta {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  z-index: 1;
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--texto);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.tarjeta__play::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 54%;
  transform: translate(-50%, -50%);
  border-style: solid;
  border-width: 0.45rem 0 0.45rem 0.75rem;
  border-color: transparent transparent transparent #fff;
}

.tarjeta__texto {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  padding: 0.9rem;
}

.tarjeta--principal .tarjeta__titulo { font-size: 1.5rem; line-height: 1.2; }

.tarjeta__fecha { font-size: 0.72rem; color: rgba(255, 255, 255, 0.75); }

/* ============ ventana del reproductor ============ */
.visor {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(0, 0, 0, 0.75);
}

.visor.abierto { display: flex; }

.visor__caja {
  width: min(960px, 100%);
  overflow: hidden;
  border-radius: 10px;
  background: #000;
}

.visor__marco { position: relative; aspect-ratio: 16 / 9; }

.visor__marco iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.visor__pie {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.6rem 0.9rem;
  background: var(--barra);
  font-size: 0.85rem;
}

.visor__pie a { color: #8fb8ff; }

.visor__cerrar {
  border: 0;
  background: none;
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
}

@media (max-width: 900px) {
  .hero { flex-direction: column; align-items: stretch; gap: 1rem; }
}

/* ============ mosaico: noticias intercaladas con monedas ============ */
.tendencias { container-type: inline-size; }

#comparativo-caja:not(:empty) { margin-top: 1rem; }

.mosaico__aviso {
  margin: 0 0 1rem;
  font-size: 0.9rem;
  color: var(--texto-suave);
}

.mosaico {
  --alto-celda: 300px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-auto-rows: var(--alto-celda);
  gap: 1rem;
}

.mosaico > .cuadro {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.mosaico > .cuadro .lienzo {
  flex: 1;
  min-height: 0;
  height: auto;
}

/* 3 columnas si hay espacio; si no, 1 columna (siguen alternadas) */
@container (min-width: 640px) {
  .mosaico { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.columnas { margin: 0 0 2.5rem; }

.columnas h2 {
  margin: 0 0 1rem;
  font-size: 1.05rem;
  font-weight: 700;
}

 <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  const COLORES = { EUR: "#2b4c9b", JPY: "#b23a48", GBP: "#6b3fa0", CNY: "#b8700a" };
  const CODIGOS = { euro: "EUR", yen: "JPY", libra: "GBP", yuan: "CNY" };
  
Chart.defaults.font.family = "Inter, 'Segoe UI', sans-serif";
Chart.defaults.color = "#6b7280";
Chart.defaults.borderColor = "#eceef1";

  let graficos = {};

  const NOTICIAS_EN_MOSAICO = 5;   // 4 monedas + 5 noticias = cuadrícula 3×3

const mosaico = document.getElementById("mosaico");
const avisosMosaico = document.getElementById("mosaico-avisos");
const cajaComparativo = document.getElementById("comparativo-caja");

const partes = {
  monedas: { tarjetas: [], mensaje: "Cargando…" },
  medios:  { tarjetas: [], mensaje: "Cargando…" },
};

// noticia, moneda, noticia, moneda...
function intercalar(noticias, monedas) {
  const salida = [];
  const total = Math.max(noticias.length, monedas.length);
  for (let i = 0; i < total; i++) {
    if (i < noticias.length) salida.push(noticias[i]);
    if (i < monedas.length) salida.push(monedas[i]);
  }
  return salida;
}

function pintarMosaico() {
  mosaico.replaceChildren(...intercalar(partes.medios.tarjetas, partes.monedas.tarjetas));

  const mensajes = [...new Set(Object.values(partes).map((p) => p.mensaje).filter(Boolean))];
  avisosMosaico.replaceChildren(...mensajes.map((texto) => {
    const aviso = document.createElement("p");
    aviso.className = "mosaico__aviso";
    aviso.textContent = texto;
    return aviso;
  }));

  Object.values(graficos).forEach((g) => g.resize());
}

function destruirGraficos() {
  Object.values(graficos).forEach((g) => g.destroy());
  graficos = {};
}

  async function cargar(periodo) {
  try {
    const respuesta = await fetch(`/api/tendencias?periodo=${periodo}`);
    if (!respuesta.ok) throw new Error("Respuesta no válida");
    dibujar(await respuesta.json());
  } catch (error) {
    destruirGraficos();
    cajaComparativo.replaceChildren();
    partes.monedas.tarjetas = [];
    partes.monedas.mensaje = "No se pudieron cargar las monedas. Intenta de nuevo en un momento.";
    pintarMosaico();
  }
}

  function dibujar(datos) {
  destruirGraficos();
  const pendientes = [];   // los gráficos se crean cuando las tarjetas ya están en la página

  cajaComparativo.replaceChildren(crearComparativo(datos, pendientes));
  partes.monedas.tarjetas = Object.entries(datos.monedas)
    .map(([codigo, moneda]) => crearTarjetaMoneda(codigo, moneda, datos.fechas, pendientes));
  partes.monedas.mensaje = "";
  pintarMosaico();

  pendientes.forEach(([clave, canvas, config]) => {
    graficos[clave] = new Chart(canvas, config);
  });
}

function crearTarjetaMoneda(codigo, moneda, fechas, pendientes) {
  const sube = moneda.variacion >= 0;
  const signo = sube ? "+" : "";
  const lectura = sube ? "se debilitó" : "se fortaleció";

  const tarjeta = document.createElement("article");
  tarjeta.className = "cuadro";
  tarjeta.id = `cuadro-${codigo}`;
  tarjeta.innerHTML = `
    <h3>${moneda.nombre} <span>${codigo}</span></h3>
    <div class="cifra">${moneda.ultimo.toFixed(4)} <small>por 1 USD</small></div>
    <div class="variacion ${sube ? "sube" : "baja"}">${signo}${moneda.variacion.toFixed(2)} % · ${lectura} frente al dólar</div>
    <div class="lienzo"><canvas></canvas></div>`;

  pendientes.push([codigo, tarjeta.querySelector("canvas"), {
    type: "line",
    data: {
      labels: fechas,
      datasets: [{
        data: moneda.valores,
        borderColor: COLORES[codigo],
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.25,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxTicksLimit: 5, maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { maxTicksLimit: 5 } },
      },
    },
  }]);
  return tarjeta;
}

function crearComparativo(datos, pendientes) {
  const tarjeta = document.createElement("article");
  tarjeta.className = "cuadro cuadro--ancho";
  tarjeta.id = "comparativo";
  tarjeta.innerHTML = `
    <h3>Comparación frente al dólar</h3>
    <div class="variacion">Valor de cada moneda en dólares, con base 100 al inicio del periodo. Sobre 100 significa que se fortaleció.</div>
    <div class="lienzo lienzo--alto"><canvas></canvas></div>`;

  const series = Object.entries(datos.monedas).map(([codigo, moneda]) => ({
    label: moneda.nombre,
    data: moneda.valores.map((v) => Number(((moneda.valores[0] / v) * 100).toFixed(2))),
    borderColor: COLORES[codigo],
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.25,
  }));

  pendientes.push(["comparativo", tarjeta.querySelector("canvas"), {
    type: "line",
    data: { labels: datos.fechas, datasets: series },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: true, position: "bottom" } },
      scales: {
        x: { ticks: { maxTicksLimit: 6, maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { maxTicksLimit: 6 } },
      },
    },
  }]);
  return tarjeta;
}

  function irA(codigo) {
    const suave = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const tarjeta = codigo ? document.getElementById(`cuadro-${codigo}`) : null;
    const destino = tarjeta || document.querySelector(".tendencias");

    destino.scrollIntoView({
      behavior: suave ? "smooth" : "auto",
      block: tarjeta ? "center" : "start",
    });

    if (tarjeta) {
      tarjeta.classList.add("resaltado");
      setTimeout(() => tarjeta.classList.remove("resaltado"), 1800);
    }
  }

  document.querySelector(".menu").addEventListener("click", (e) => {
    const boton = e.target.closest(".menu__boton");
    if (boton) irA(CODIGOS[boton.dataset.moneda]);
  });

  document.querySelectorAll(".periodos button").forEach((boton) => {
    boton.addEventListener("click", () => {
      document.querySelector(".periodos .activo").classList.remove("activo");
      boton.classList.add("activo");
      cargar(boton.dataset.periodo);
    });
  });

const INFO = {
  dolar: [
    ["País o zona", "Estados Unidos"],
    ["Banco central", "Reserva Federal"],
    ["Símbolo", "$"],

const menuMonedas = document.querySelector(".menu");
const desplegable = document.getElementById("desplegable");
let temporizador;

function abrirDesplegable(boton) {
  clearTimeout(temporizador);

  desplegable.innerHTML = INFO[boton.dataset.moneda]
    .map(([titulo, valor]) => `
      <div class="desplegable__cuadro" role="menuitem">
        <span>${titulo}</span>
        <strong>${valor}</strong>
      </div>`)
    .join("");

  const caja = boton.getBoundingClientRect();
  desplegable.style.top = `${caja.bottom}px`;
  desplegable.style.left = `${caja.left}px`;
  desplegable.classList.add("visible");

  // evita que la lista se salga por el borde derecho de la pantalla
  const ancho = desplegable.offsetWidth;
  const izquierda = Math.max(8, Math.min(caja.left, window.innerWidth - ancho - 8));
  desplegable.style.left = `${izquierda}px`;

  menuMonedas.classList.add("pausado");
}

function cerrarDesplegable() {
  temporizador = setTimeout(() => {
    desplegable.classList.remove("visible");
    menuMonedas.classList.remove("pausado");
  }, 150);
}

menuMonedas.addEventListener("mouseover", (e) => {
  const boton = e.target.closest(".menu__boton");
  if (boton) abrirDesplegable(boton);
});
menuMonedas.addEventListener("focusin", (e) => {
  const boton = e.target.closest(".menu__boton");
  if (boton) abrirDesplegable(boton);
});
menuMonedas.addEventListener("mouseout", cerrarDesplegable);
menuMonedas.addEventListener("focusout", cerrarDesplegable);

desplegable.addEventListener("mouseenter", () => clearTimeout(temporizador));
desplegable.addEventListener("mouseleave", cerrarDesplegable);

window.addEventListener("scroll", () => {
  desplegable.classList.remove("visible");
  menuMonedas.classList.remove("pausado");
}, { passive: true });

async function cargarNoticias() {
  const lista = document.getElementById("lista-noticias");
  try {
    const respuesta = await fetch("/api/noticias");
    if (!respuesta.ok) throw new Error("Respuesta no válida");
    const noticias = await respuesta.json();

    lista.textContent = "";
    if (noticias.length === 0) {
      lista.textContent = "No hay noticias recientes.";
      return;
    }

    noticias.forEach((n) => {
      const enlace = document.createElement("a");
      enlace.className = "noticia";
      enlace.href = n.url;
      enlace.target = "_blank";
      enlace.rel = "noopener noreferrer";

      const titulo = document.createElement("span");
      titulo.className = "noticia__titulo";
      titulo.textContent = n.titulo;

      const meta = document.createElement("span");
      meta.className = "noticia__meta";
      meta.textContent = `${n.fuente} · ${n.fecha}`;

      enlace.append(titulo, meta);
      lista.appendChild(enlace);
    });
  } catch (error) {
    lista.textContent = "No se pudieron cargar las noticias. Intenta de nuevo en un momento.";
  }
}

const panelNoticias = document.getElementById("panel-noticias");
const botonNoticias = document.getElementById("abrir-noticias");
const fondoNoticias = document.getElementById("fondo-noticias");

function alternarNoticias(abrir) {
  panelNoticias.classList.toggle("abierto", abrir);
  fondoNoticias.classList.toggle("visible", abrir);
  botonNoticias.setAttribute("aria-expanded", String(abrir));
}

botonNoticias.addEventListener("click", () => alternarNoticias(true));
document.getElementById("cerrar-noticias").addEventListener("click", () => alternarNoticias(false));
fondoNoticias.addEventListener("click", () => alternarNoticias(false));
document.addEventListener("keydown", (e) => {

const chatPanel = document.getElementById("chat");
const chatAbrir = document.getElementById("abrir-chat");
const chatMensajes = document.getElementById("chat-mensajes");
const chatTexto = document.getElementById("chat-texto");
const chatEnviar = document.getElementById("chat-enviar");
const historialChat = [];

function alternarChat(abrir) {
  chatPanel.classList.toggle("abierto", abrir);
  chatAbrir.setAttribute("aria-expanded", String(abrir));
  if (abrir) chatTexto.focus();
}

function agregarMensaje(texto, clase) {
  const burbuja = document.createElement("div");
  burbuja.className = `chat__msg ${clase}`;
  burbuja.textContent = texto;
  chatMensajes.appendChild(burbuja);
  chatMensajes.scrollTop = chatMensajes.scrollHeight;
  return burbuja;
}

async function enviarPregunta() {
  const texto = chatTexto.value.trim();
  if (!texto) return;

  chatTexto.value = "";
  chatEnviar.disabled = true;
  agregarMensaje(texto, "chat__msg--yo");
  historialChat.push({ role: "user", content: texto });
  const espera = agregarMensaje("Escribiendo…", "chat__msg--ia");

  try {
    const respuesta = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensajes: historialChat }),
    });
    if (!respuesta.ok) throw new Error("Respuesta no válida");
    const datos = await respuesta.json();
    espera.textContent = datos.respuesta;
    historialChat.push({ role: "assistant", content: datos.respuesta });
  } catch (error) {
    espera.textContent = "No se pudo obtener respuesta. Intenta de nuevo en un momento.";
    historialChat.pop();   // quita la pregunta que falló para no romper el orden
  } finally {
    chatEnviar.disabled = false;
    chatMensajes.scrollTop = chatMensajes.scrollHeight;
  }
}

chatAbrir.addEventListener("click", () => alternarChat(!chatPanel.classList.contains("abierto")));
document.getElementById("cerrar-chat").addEventListener("click", () => alternarChat(false));
chatEnviar.addEventListener("click", enviarPregunta);
chatTexto.addEventListener("keydown", (e) => {
  if (e.key === "Enter") enviarPregunta();
});

function formatearPrecio(n) {
  return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function crearGrupoTicker(acciones, oculto) {
  const grupo = document.createElement("div");
  grupo.className = "ticker__grupo";
  if (oculto) grupo.setAttribute("aria-hidden", "true");

  acciones.forEach((a) => {
    const item = document.createElement("div");
    item.className = "ticker__item";

    const simbolo = document.createElement("span");
    simbolo.className = "ticker__simbolo";
    simbolo.textContent = a.simbolo;

    const nombre = document.createElement("span");
    nombre.className = "ticker__nombre";
    nombre.textContent = a.nombre;

    const precio = document.createElement("span");
    precio.className = "ticker__precio";
    precio.textContent = formatearPrecio(a.precio);

    const cambio = document.createElement("span");
    cambio.className = "ticker__cambio";
    if (a.variacion === null) {
      cambio.textContent = "—";
    } else {
      const sube = a.variacion >= 0;
      cambio.classList.add(sube ? "sube" : "baja");
      cambio.textContent = `${sube ? "▲" : "▼"} ${Math.abs(a.variacion).toFixed(2)}%`;
    }

    item.append(simbolo, nombre, precio, cambio);
    grupo.appendChild(item);
  });

  return grupo;
}

async function cargarTicker() {
  const pista = document.getElementById("ticker-pista");
  try {
    const respuesta = await fetch("/api/acciones");
    if (!respuesta.ok) throw new Error("Respuesta no válida");
    const acciones = await respuesta.json();

    pista.textContent = "";
    pista.classList.remove("ticker__pista--estatica");
    // dos copias idénticas para que el bucle no tenga cortes
    pista.append(crearGrupoTicker(acciones, false), crearGrupoTicker(acciones, true));
  } catch (error) {
    pista.classList.add("ticker__pista--estatica");
    pista.textContent = "Indicadores no disponibles por ahora.";
  }
}

cargarTicker();
setInterval(cargarTicker, 5 * 60 * 1000);

const visor = document.getElementById("visor");
const visorMarco = document.getElementById("visor-marco");
const relativo = new Intl.RelativeTimeFormat("es", { numeric: "auto" });

function haceCuanto(ts) {
  const minutos = Math.round((ts * 1000 - Date.now()) / 60000);
  if (Math.abs(minutos) < 60) return relativo.format(minutos, "minute");
  const horas = Math.round(minutos / 60);
  if (Math.abs(horas) < 48) return relativo.format(horas, "hour");
  return relativo.format(Math.round(horas / 24), "day");
}

function abrirVideo(id, url) {
  const marco = document.createElement("iframe");
  marco.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;
  marco.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  marco.allowFullscreen = true;
  marco.referrerPolicy = "strict-origin-when-cross-origin";
  marco.title = "Video";
  visorMarco.replaceChildren(marco);
  document.getElementById("visor-enlace").href = url;
  visor.classList.add("abierto");
}

function cerrarVideo() {
  visor.classList.remove("abierto");
  visorMarco.replaceChildren();   // quita el reproductor para detener el video
}

document.getElementById("visor-cerrar").addEventListener("click", cerrarVideo);
visor.addEventListener("click", (e) => { if (e.target === visor) cerrarVideo(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarVideo(); });

function crearTarjeta(n) {
  const esVideo = n.tipo === "video";
  const tarjeta = document.createElement(esVideo ? "button" : "a");
  tarjeta.className = "tarjeta";

  if (esVideo) {
    tarjeta.type = "button";
    tarjeta.setAttribute("aria-label", `Reproducir video: ${n.titulo}`);
    tarjeta.addEventListener("click", () => abrirVideo(n.video_id, n.url));
  } else {
    tarjeta.href = n.url;
    tarjeta.target = "_blank";
    tarjeta.rel = "noopener noreferrer";
  }

  if (n.imagen) {
    const img = document.createElement("img");
    img.className = "tarjeta__imagen";
    img.alt = "";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.addEventListener("error", () => {
      if (n.imagen_respaldo && img.src !== n.imagen_respaldo) img.src = n.imagen_respaldo;
      else img.remove();   // sin imagen, queda el fondo oscuro de la tarjeta
    });
    img.src = n.imagen;
    tarjeta.appendChild(img);
  }

  const etiqueta = document.createElement("span");
  etiqueta.className = "tarjeta__etiqueta";
  etiqueta.textContent = esVideo ? `${n.fuente} · Video` : n.fuente;
  tarjeta.appendChild(etiqueta);

  if (esVideo) {
    const play = document.createElement("span");
    play.className = "tarjeta__play";
    play.setAttribute("aria-hidden", "true");
    tarjeta.appendChild(play);
  }

  const texto = document.createElement("span");
  texto.className = "tarjeta__texto";

  const titulo = document.createElement("span");
  titulo.className = "tarjeta__titulo";
  titulo.textContent = n.titulo;

  const fecha = document.createElement("span");
  fecha.className = "tarjeta__fecha";
  fecha.textContent = haceCuanto(n.ts);

  texto.append(titulo, fecha);
  tarjeta.appendChild(texto);
  return tarjeta;
}

async function cargarMedios() {
  try {
    const [respMedios, respPropios] = await Promise.all([
      fetch("/api/medios"),
      fetch("/api/articulos"),
    ]);
    const medios = respMedios.ok ? await respMedios.json() : [];
    const propios = respPropios.ok ? await respPropios.json() : [];

    const propiosAdaptados = propios.map((a) => ({
      tipo: "propio",
      fuente: "G20.VIX",
      titulo: a.titulo,
      url: `/articulos/${a.slug}`,
      imagen: null,
      ts: a.ts || 0,
    }));

    const combinados = [...medios, ...propiosAdaptados].sort((a, b) => b.ts - a.ts);

    partes.medios.tarjetas = combinados.slice(0, NOTICIAS_EN_MOSAICO).map((n) => crearTarjeta(n));
    partes.medios.mensaje = combinados.length ? "" : "No hay contenidos recientes.";
  } catch (error) {
    partes.medios.tarjetas = [];
    partes.medios.mensaje = "No se pudieron cargar los contenidos. Intenta de nuevo en un momento.";
  }
  pintarMosaico();
}

async function cargarColumnas() {
  const pista = document.getElementById("columnas-pista");
  try {
    const respuesta = await fetch("/api/articulos");
    if (!respuesta.ok) throw new Error("Respuesta no válida");
    const articulos = await respuesta.json();

    if (articulos.length === 0) {
      pista.replaceChildren(avisoColumnas("Todavía no hay artículos publicados."));
      return;
    }
    pista.replaceChildren(...articulos.map(crearColumna));
  } catch (error) {
    pista.replaceChildren(avisoColumnas("No se pudieron cargar los artículos."));
  }
}

function avisoColumnas(texto) {
  const p = document.createElement("p");
  p.className = "columnas__aviso";
  p.textContent = texto;
  return p;
}

function crearColumna(a) {
  const enlace = document.createElement("a");
  enlace.className = "columna";
  enlace.href = `/articulos/${a.slug}`;

  const fecha = document.createElement("span");
  fecha.className = "columna__fecha";
  fecha.textContent = a.fecha;

  const titulo = document.createElement("span");
  titulo.className = "columna__titulo";
  titulo.textContent = a.titulo;

  const bajada = document.createElement("span");
  bajada.className = "columna__bajada";
  bajada.textContent = a.bajada;

  enlace.append(fecha, titulo, bajada);

  if (a.autor || a.materia) {
    const fila = document.createElement("span");
    fila.className = "columna__autor";

    const avatar = document.createElement("span");
    avatar.className = "columna__avatar" + (a.genero === "hombre" || a.genero === "mujer" ? ` columna__avatar--${a.genero}` : "");
    avatar.setAttribute("aria-hidden", "true");

    const firma = document.createElement("span");
    firma.className = "columna__firma";

    if (a.autor) {
      const nombre = document.createElement("span");
      nombre.className = "columna__nombre";
      nombre.textContent = a.autor;
      firma.appendChild(nombre);
    }
    if (a.materia) {
      const materia = document.createElement("span");
      materia.className = "columna__materia";
      materia.textContent = a.materia;
      firma.appendChild(materia);
    }

    fila.append(avatar, firma);
    enlace.appendChild(fila);
  }

  return enlace;
}

(function habilitarArrastre(pista) {
  let activo = false, inicioX = 0, scrollInicial = 0;
  pista.addEventListener("mousedown", (e) => {
    activo = true;
    inicioX = e.pageX;
    scrollInicial = pista.scrollLeft;
  });
  window.addEventListener("mouseup", () => { activo = false; });
  pista.addEventListener("mouseleave", () => { activo = false; });
  pista.addEventListener("mousemove", (e) => {
    if (!activo) return;
    e.preventDefault();
    pista.scrollLeft = scrollInicial - (e.pageX - inicioX);
  });
})(document.getElementById("columnas-pista"));

cargarColumnas();
cargarMedios();
cargarNoticias();

  cargar("6m");
</script>
